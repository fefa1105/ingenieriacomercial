<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malla interactiva · Ingeniería Comercial</title>
<style>
  :root{
    --ink:#131a2b; --paper:#eceef3; --surface:#fff;
    --rule:#c9d0dc; --rule-soft:#e3e7ee; --muted:#5f6879;
    --accent:#1f3fd4; --ok:#0d6e5f; --ok-bg:#dcefea;
    --warn:#b3162f; --warn-bg:#fdeaed; --lock:#8b93a5; --lock-bg:#f4f5f8;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font); background:var(--paper); color:var(--ink);
       font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
  button{font-family:inherit; font-size:inherit; cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .lbl{font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .num{font-variant-numeric:tabular-nums}

  .top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:13px 20px;
       background:var(--ink); color:#fff}
  .brand{font-weight:700; font-size:16px; margin-right:auto}
  .brand span{display:block; font-size:10px; font-weight:600; letter-spacing:.14em;
              text-transform:uppercase; color:#8b95ab; margin-top:1px}
  .act{background:none; color:#c2cadb; border:1px solid #333c55; border-radius:6px;
       padding:7px 12px; font-size:12px; font-weight:600}
  .act:hover{color:#fff; border-color:#5d6785}
  a.act{text-decoration:none; display:inline-block}

  .wrap{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; padding:18px; align-items:start}
  .card{background:var(--surface); border:1px solid var(--rule); border-radius:9px}
  .card>header{padding:11px 14px; border-bottom:1px solid var(--rule-soft);
               display:flex; align-items:center; justify-content:space-between; gap:10px}
  .side{position:sticky; top:18px; display:flex; flex-direction:column; gap:14px}

  /* ---------- aviso de datos ---------- */
  .nota{margin:0; padding:10px 14px; background:#fff8e6; border-bottom:1px solid #f0e2bd;
        font-size:12px; color:#6b551b}
  .nota b{display:block; margin-bottom:2px}
  .nota button{background:none; border:0; padding:0; color:#6b551b; font-weight:700;
               text-decoration:underline; font-size:12px}

  /* ---------- la malla ---------- */
  .mallawrap{position:relative; overflow:auto; padding:14px}
  .mallagrid{position:relative; display:grid; gap:8px 14px; min-width:1180px;
             grid-template-columns:repeat(10, minmax(104px,1fr))}
  .semhead{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
           color:var(--muted); text-align:center; padding-bottom:2px;
           border-bottom:1px solid var(--rule); grid-row:1}
  svg.arcos{position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:0}

  .ramo{position:relative; z-index:1; text-align:left; width:100%;
        border:1px solid var(--rule); border-left:3px solid var(--rule);
        border-radius:6px; background:var(--surface); padding:6px 8px;
        min-height:56px; display:flex; flex-direction:column; justify-content:center;
        transition:transform .12s ease, box-shadow .12s ease}
  .ramo .nm{font-size:11.5px; font-weight:600; line-height:1.2}
  .ramo .cd{font-size:9.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}
  .ramo:hover{transform:translateY(-1px); box-shadow:0 2px 8px #131a2b1f}

  .ramo.aprobado{background:var(--ok-bg); border-color:#a8d4c9; border-left-color:var(--ok); color:var(--ok)}
  .ramo.aprobado .cd{color:#4a8b7d}
  .ramo.aprobado .nm::before{content:"✓ "; font-weight:700}
  .ramo.disponible{border-color:var(--accent); border-left-color:var(--accent);
                   box-shadow:inset 0 0 0 1px var(--accent)}
  .ramo.bloqueado{background:var(--lock-bg); color:var(--lock); border-style:dashed;
                  border-left-color:var(--lock)}
  .ramo.bloqueado .cd{color:var(--lock)}
  .ramo.electivo .nm{font-style:italic}
  .ramo.sel{outline:2px solid var(--ink); outline-offset:1px}
  .ramo.atenuado{opacity:.32}
  @keyframes pulso{0%{box-shadow:0 0 0 0 #1f3fd455}70%{box-shadow:0 0 0 9px #1f3fd400}100%{box-shadow:0 0 0 0 #1f3fd400}}
  .ramo.nuevo{animation:pulso .7s ease-out 2}

  /* ---------- panel ---------- */
  .prog{padding:12px 14px}
  .barra{height:7px; background:var(--rule-soft); border-radius:99px; overflow:hidden; margin:7px 0 4px}
  .barra i{display:block; height:100%; background:var(--ok); border-radius:99px; transition:width .25s}
  .cifras{display:flex; justify-content:space-between; font-size:12px; color:var(--muted)}
  .cifras b{color:var(--ink); font-variant-numeric:tabular-nums}

  .lista{max-height:30vh; overflow:auto}
  .item{display:flex; gap:8px; width:100%; text-align:left; background:none; border:0;
        border-bottom:1px solid var(--rule-soft); padding:8px 14px; align-items:flex-start}
  .item:hover{background:#f5f7fb}
  .item .pt{width:3px; align-self:stretch; border-radius:2px; background:var(--accent); flex:none}
  .item .nm{font-size:12.5px; font-weight:600; line-height:1.25}
  .item .mt{font-size:10.5px; color:var(--muted); margin-top:1px}
  .vacio{padding:16px 14px; color:var(--muted); font-size:12.5px}

  .det{padding:12px 14px}
  .det h3{margin:0 0 2px; font-size:14px}
  .det .sub{font-size:11px; color:var(--muted); margin-bottom:10px; font-variant-numeric:tabular-nums}
  .det h4{margin:12px 0 5px; font-size:10px; font-weight:700; letter-spacing:.12em;
          text-transform:uppercase; color:var(--muted)}
  .req{display:flex; align-items:center; gap:6px; padding:4px 0; font-size:12.5px;
       border-bottom:1px solid var(--rule-soft)}
  .req .est{flex:none; font-size:11px; font-weight:700; width:15px; text-align:center}
  .req .tx{flex:1; min-width:0}
  .req .x{border:0; background:none; color:var(--muted); font-size:15px; line-height:1; padding:0 2px}
  .req .x:hover{color:var(--warn)}
  .badge{font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
         padding:1px 5px; border-radius:3px; flex:none}
  .b-alta{background:var(--ok-bg); color:var(--ok)}
  .b-media{background:#eef1f7; color:var(--muted)}
  .b-revisar{background:var(--warn-bg); color:var(--warn)}
  .add{display:flex; gap:5px; margin-top:8px}
  .add select{flex:1; min-width:0; font:inherit; font-size:12px; padding:5px;
              border:1px solid var(--rule); border-radius:5px; background:#fbfcfe; color:var(--ink)}
  .add button{border:1px solid var(--accent); background:var(--accent); color:#fff;
              border-radius:5px; padding:5px 10px; font-size:12px; font-weight:600}
  .ayuda{font-size:11px; color:var(--muted); margin:8px 0 0}

  dialog{border:1px solid var(--rule); border-radius:10px; padding:0; max-width:620px; width:92%;
         box-shadow:0 18px 50px #131a2b40}
  dialog::backdrop{background:#131a2b66}
  dialog header{padding:13px 16px; border-bottom:1px solid var(--rule-soft);
                display:flex; justify-content:space-between; align-items:center}
  dialog header h2{margin:0; font-size:15px}
  dialog .cuerpo{padding:14px 16px; max-height:62vh; overflow:auto; font-size:13px}
  dialog .cuerpo p{margin:0 0 10px}
  dialog table{border-collapse:collapse; width:100%; font-size:12px; margin-bottom:14px}
  dialog th{text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
            color:var(--muted); border-bottom:1px solid var(--rule); padding:4px 6px}
  dialog td{border-bottom:1px solid var(--rule-soft); padding:4px 6px; vertical-align:top}
  dialog .cerrar{border:1px solid var(--rule); background:#fff; border-radius:6px;
                 padding:5px 11px; font-size:12px; font-weight:600}

  @media (max-width:1000px){
    .wrap{grid-template-columns:1fr}
    .side{position:static}
  }
  @media print{
    .top,.side,.nota{display:none}
    .wrap{display:block; padding:0}
    .card{border:0}
    .card>header{display:none}
    .mallawrap{overflow:visible; padding:0}
    .mallagrid{min-width:0}
    .ramo{min-height:44px}
    @page{size:landscape; margin:10mm}
  }
</style>
</head>

<div class="top">
  <div class="brand">Malla interactiva<span>Ingeniería Comercial · Plan 2014</span></div>
  <button type="button" class="act" id="btnDatos">Ver prerrequisitos</button>

        </div>
      </div>
    </div>

    <div class="card">
      <header>
        <span class="lbl">Puedo tomar ahora</span>
        <span class="lbl num" id="cDisp">0</span>
      </header>
      <div class="lista" id="disponibles"></div>
    </div>

    <div class="card">
      <header><span class="lbl">Detalle</span></header>
      <div class="det" id="detalle"></div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <header>
    <h2>Prerrequisitos: de dónde salen</h2>
    <button type="button" class="cerrar" id="dlgX">Cerrar</button>
  </header>
  <div class="cuerpo" id="dlgCuerpo"></div>
</dialog>

  {"de": "451836", "a": "451853", "confianza": "media", "razon": "misma banda horizontal de la malla"},   // Microeconomía I -> Macroeconomía II
  {"de": "451840", "a": "451855", "confianza": "revisar", "razon": "la flecha cruza de banda; puede estar mal leida"},   // Macroeconomía I -> Evaluación de Proyectos
  {"de": "451845", "a": "451855", "confianza": "media", "razon": "misma banda horizontal de la malla"},   // Finanzas I -> Evaluación de Proyectos
  {"de": "451846", "a": "451857", "confianza": "alta", "razon": "secuencia del mismo ramo (I -> II)"},   // Gestión de Marketing I -> Gestión de Marketing II
  {"de": "451854", "a": "451858", "confianza": "revisar", "razon": "la flecha cruza de banda; puede estar mal leida"},   // Administración Estratégica I -> Gestión de Personas II
  {"de": "451870", "a": "451871", "confianza": "media", "razon": "misma banda horizontal de la malla"},   // Inglés Comunic. III Nivel Básico -> Inglés Comunic. IV Nivel Básico Alto
  {"de": "451854", "a": "451861", "confianza": "alta", "razon": "secuencia del mismo ramo (I -> II)"},   // Administración Estratégica I -> Administración Estratégica II
  {"de": "451854", "a": "451862", "confianza": "revisar", "razon": "la flecha cruza de banda; puede estar mal leida"},   // Administración Estratégica I -> Met. de la Investigación en Administración
  {"de": "451862", "a": "451866", "confianza": "media", "razon": "misma banda horizontal de la malla"}   // Met. de la Investigación en Administración -> Trabajo Profesional en Administración
];

const store = (() => {
  const mem = {};
  try {
    localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
    return { get: k => localStorage.getItem(k), set: (k, v) => localStorage.setItem(k, v) };
  } catch (e) {
    return { get: k => (k in mem ? mem[k] : null), set: (k, v) => { mem[k] = v; } };
  }
})();

/* algunos navegadores antiguos / entornos embebidos no traen rAF */
const raf = (typeof requestAnimationFrame === 'function')
  ? requestAnimationFrame : (fn => setTimeout(fn, 16));

const esc = s => (s || '').toString()
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const RAMO = {};
MALLA.ramos.forEach(r => RAMO[r.codigo] = r);
const SEMS = [...new Set(MALLA.ramos.map(r => r.semestre))].sort((a, b) => a - b);
const BANDAS = Math.max(...MALLA.ramos.map(r => r.banda)) + 1;
const CRED_TOT = MALLA.ramos.reduce((a, r) => a + (r.creditos || 0), 0);

const state = {
  aprobados: new Set(JSON.parse(store.get('malla:aprobados') || '[]').filter(c => RAMO[c])),
  sel: null,
  edits: JSON.parse(store.get('malla:edits') || 'null'),
  recien: new Set(),
};

/* ---------- prerrequisitos vigentes (borrador + correcciones) ---------- */
function relaciones() {
  if (state.edits) return state.edits;
  return PREREQ.map(r => ({ ...r }));
}
function reqsDe(cod) {
  return relaciones().filter(r => r.a === cod && RAMO[r.de]);
}
function abreA(cod) {
  return relaciones().filter(r => r.de === cod && RAMO[r.a]);
}
function guardar() {
  store.set('malla:aprobados', JSON.stringify([...state.aprobados]));
  if (state.edits) store.set('malla:edits', JSON.stringify(state.edits));
}

const aprobado = c => state.aprobados.has(c);
function faltantes(cod) {
  return reqsDe(cod).filter(r => !aprobado(r.de)).map(r => r.de);
}
function estado(cod) {
  if (aprobado(cod)) return 'aprobado';
  return faltantes(cod).length ? 'bloqueado' : 'disponible';
}

/* ---------- cadena completa que falta para un ramo ---------- */
function cadenaFaltante(cod, visto = new Set()) {
  const out = [];
  for (const r of reqsDe(cod)) {
    if (visto.has(r.de)) continue;
    visto.add(r.de);
    if (!aprobado(r.de)) {
      out.push(...cadenaFaltante(r.de, visto));
      out.push(r.de);
    }
  }
  return [...new Set(out)];
}

/* ---------- dibujo de la malla ---------- */
function pintarMalla() {
  const g = document.getElementById('malla');
  g.style.gridTemplateRows = `auto repeat(${BANDAS}, minmax(56px,auto))`;
  let html = '<svg class="arcos" id="arcos"></svg>';
  SEMS.forEach((s, i) => {
    html += `<div class="semhead" style="grid-column:${i + 1}">${s}º sem.</div>`;
  });
  const rel = state.sel ? new Set([state.sel,
    ...reqsDe(state.sel).map(r => r.de), ...abreA(state.sel).map(r => r.a)]) : null;
  for (const r of MALLA.ramos) {
    const est = estado(r.codigo);
    const cls = ['ramo', est];
    if (r.electivo) cls.push('electivo');
    if (state.sel === r.codigo) cls.push('sel');
    if (rel && !rel.has(r.codigo)) cls.push('atenuado');
    if (state.recien.has(r.codigo)) cls.push('nuevo');
    const col = SEMS.indexOf(r.semestre) + 1;
    const etq = r.electivo ? `${r.creditos} cr` : `${r.codigo} · ${r.creditos || '–'} cr`;
    // en los bloqueados el tooltip dice que falta, sin necesidad de marcarlos
    const falt = est === 'bloqueado'
      ? 'Te falta aprobar: ' + faltantes(r.codigo).map(c => RAMO[c].nombre).join(', ')
      : (est === 'disponible' ? 'Puedes tomarlo' : 'Aprobado');
    html += `<button type="button" class="${cls.join(' ')}" data-cod="${r.codigo}"
      style="grid-column:${col}; grid-row:${r.banda + 2}"
      title="${esc(r.nombre + ' — ' + falt)}"
      aria-pressed="${est === 'aprobado'}">
      <span class="nm">${esc(r.nombre)}</span><span class="cd">${esc(etq)}</span></button>`;
  }
  g.innerHTML = html;
  g.querySelectorAll('.ramo').forEach(b => {
    b.onclick = () => alternar(b.dataset.cod);
  });
  raf(dibujarArcos);
}

function alternar(cod) {
  const antes = new Set(MALLA.ramos.filter(r => estado(r.codigo) === 'disponible').map(r => r.codigo));
  if (aprobado(cod)) state.aprobados.delete(cod); else state.aprobados.add(cod);
  state.recien = new Set(MALLA.ramos
    .filter(r => estado(r.codigo) === 'disponible' && !antes.has(r.codigo)).map(r => r.codigo));
  state.sel = cod;
  pintar();
  setTimeout(() => { state.recien = new Set(); }, 1600);
}

/* ---------- flechas ---------- */
function dibujarArcos() {
  const g = document.getElementById('malla');
  const svg = document.getElementById('arcos');
  if (!svg || !g) return;
  const base = g.getBoundingClientRect();
  if (!base.width) return;
  const caja = {};
  g.querySelectorAll('.ramo').forEach(b => {
    const r = b.getBoundingClientRect();
    caja[b.dataset.cod] = { x1: r.left - base.left, x2: r.right - base.left,
      y: r.top - base.top + r.height / 2 };
  });
  const ESTILO = { alta: ['4 0', .5], media: ['5 3', .42], revisar: ['2 3', .55] };
  let d = `<defs>
    <marker id="mk" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/></marker></defs>`;
  for (const r of relaciones()) {
    const a = caja[r.de], b = caja[r.a];
    if (!a || !b) continue;
    const activo = state.sel === r.de || state.sel === r.a;
    const [dash, op] = ESTILO[r.confianza] || ESTILO.media;
    const color = r.confianza === 'revisar' ? 'var(--warn)'
      : (activo ? 'var(--accent)' : 'var(--muted)');
    const mx = a.x2 + Math.max(7, (b.x1 - a.x2) / 2);
    d += `<path d="M${a.x2} ${a.y} H${mx} V${b.y} H${b.x1 - 2}"
      fill="none" stroke="${color}" stroke-width="${activo ? 1.9 : 1.1}"
      stroke-dasharray="${dash}" opacity="${activo ? .95 : (state.sel ? .12 : op)}"
      marker-end="url(#mk)" style="color:${color}"/>`;
  }
  svg.innerHTML = d;
}
window.addEventListener('resize', () => raf(dibujarArcos));

/* ---------- panel ---------- */
function pintarPanel() {
  const cred = MALLA.ramos.filter(r => aprobado(r.codigo))
    .reduce((a, r) => a + (r.creditos || 0), 0);
  document.getElementById('cCred').textContent = cred;
  document.getElementById('cCredTot').textContent = CRED_TOT;
  document.getElementById('cRamos').textContent = state.aprobados.size;
  document.getElementById('cRamosTot').textContent = MALLA.ramos.length;
  document.getElementById('barra').style.width = (100 * cred / CRED_TOT).toFixed(1) + '%';

  const disp = MALLA.ramos.filter(r => estado(r.codigo) === 'disponible');
  document.getElementById('cDisp').textContent = disp.length;
  document.getElementById('disponibles').innerHTML = disp.length
    ? disp.map(r => `<button type="button" class="item" data-cod="${r.codigo}">
        <span class="pt"></span><span>
        <span class="nm">${esc(r.nombre)}</span>
        <span class="mt">${r.semestre}º sem. · ${r.creditos || '–'} cr</span></span></button>`).join('')
    : '<p class="vacio">Nada disponible: marca los ramos que ya aprobaste.</p>';
  document.querySelectorAll('#disponibles .item').forEach(b =>
    b.onclick = () => { state.sel = b.dataset.cod; pintar(); });

  document.getElementById('leyenda').textContent =
    `${state.aprobados.size} aprobados · ${disp.length} disponibles`;

  // detalle
  const el = document.getElementById('detalle');
  if (!state.sel) {
    el.innerHTML = '<p class="vacio" style="padding:4px 0">Toca un ramo en la malla para ver sus '
      + 'prerrequisitos y qué desbloquea.</p>';
    return;
  }
  const r = RAMO[state.sel], est = estado(r.codigo), reqs = reqsDe(r.codigo), abre = abreA(r.codigo);
  const falta = cadenaFaltante(r.codigo);
  const ETQ = { aprobado: 'Aprobado', disponible: 'Puedes tomarlo', bloqueado: 'Bloqueado' };
  let h = `<h3>${esc(r.nombre)}</h3>
    <p class="sub">${r.electivo ? 'Electivo' : r.codigo} · ${r.semestre}º semestre ·
       ${r.creditos || '–'} créditos · <b>${ETQ[est]}</b></p>
    <button type="button" class="add" style="width:100%"><span></span></button>`;
  h = h.replace(/<button type="button" class="add"[\s\S]*?<\/button>/,
    `<div class="add"><button type="button" id="btnToggle" style="flex:1">
       ${est === 'aprobado' ? 'Quitar de aprobados' : 'Marcar como aprobado'}</button></div>`);

  if (est === 'aprobado' && faltantes(r.codigo).length)
    h += `<p class="ayuda" style="color:var(--warn); margin:8px 0 0">Lo marcaste como aprobado,
          pero sus prerrequisitos no están marcados. Revisa si te falta marcar algo.</p>`;
  h += '<h4>Prerrequisitos</h4>';
  h += reqs.length ? reqs.map(q => {
    const ok = aprobado(q.de);
    return `<div class="req">
      <span class="est" style="color:${ok ? 'var(--ok)' : 'var(--warn)'}">${ok ? '✓' : '✗'}</span>
      <span class="tx">${esc(RAMO[q.de].nombre)}</span>
      <span class="badge b-${q.confianza}" title="${esc(q.razon || '')}">${q.confianza}</span>
      <button type="button" class="x" data-quitar="${q.de}" aria-label="Quitar prerrequisito">×</button>
    </div>`;
  }).join('') : '<p class="ayuda" style="margin-top:0">Sin prerrequisitos.</p>';

  const opts = MALLA.ramos.filter(x => x.codigo !== r.codigo
      && !reqs.some(q => q.de === x.codigo) && x.semestre <= r.semestre)
    .map(x => `<option value="${x.codigo}">${esc(x.nombre)} (${x.semestre}º)</option>`).join('');
  h += `<div class="add"><select id="selReq"><option value="">Agregar prerrequisito…</option>
        ${opts}</select><button type="button" id="btnAdd">Agregar</button></div>`;

  if (falta.length > reqs.filter(q => !aprobado(q.de)).length)
    h += `<h4>Cadena completa que te falta</h4><p class="ayuda" style="margin:0">`
      + falta.map(c => esc(RAMO[c].nombre)).join(' → ') + '</p>';

  h += '<h4>Le abre paso a</h4>';
  h += abre.length
    ? abre.map(q => `<div class="req"><span class="tx">${esc(RAMO[q.a].nombre)}</span>
        <span class="badge b-${q.confianza}">${q.confianza}</span></div>`).join('')
    : '<p class="ayuda" style="margin-top:0">No es prerrequisito de ningún ramo.</p>';

  el.innerHTML = h;
  document.getElementById('btnToggle').onclick = () => alternar(r.codigo);
  el.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => {
    state.edits = relaciones().filter(x => !(x.a === r.codigo && x.de === b.dataset.quitar));
    pintar();
  });
  document.getElementById('btnAdd').onclick = () => {
    const v = document.getElementById('selReq').value;
    if (!v) return;
    state.edits = relaciones().concat([{ de: v, a: r.codigo, confianza: 'alta',
      razon: 'confirmado a mano' }]);
    pintar();
  };
}

/* ---------- diálogo de procedencia de los datos ---------- */
function pintarDialogo() {
  const rel = relaciones();
  const cuenta = k => rel.filter(r => r.confianza === k).length;
  const fila = r => `<tr><td>${esc(RAMO[r.de].nombre)}</td><td>${esc(RAMO[r.a].nombre)}</td>
    <td><span class="badge b-${r.confianza}">${r.confianza}</span></td></tr>`;
  document.getElementById('dlgCuerpo').innerHTML = `
    <p>Ni el Excel de la Escuela ni el PDF oficial de la malla 2014 traen los prerrequisitos
       escritos: están solamente dibujados como flechas. Estas ${rel.length} relaciones se
       reconstruyeron midiendo la posición de esas 78 líneas, así que son un
       <b>borrador que hay que confirmar con la Escuela</b>.</p>
    <p><b>${cuenta('alta')}</b> de confianza alta (secuencias del tipo I → II),
       <b>${cuenta('media')}</b> medias y <b>${cuenta('revisar')}</b> dudosas.
       Puedes corregir cualquiera desde el panel de detalle y luego descargar
       el archivo con tus correcciones.</p>
    ${MALLA.huecos.length ? `<p style="color:var(--warn)"><b>Flechas que se esperaban y no
       aparecieron:</b> ${MALLA.huecos.map(h =>
         esc(RAMO[h.de].nombre) + ' → ' + esc(RAMO[h.a].nombre)).join('; ')}.
       Si la Escuela confirma que existen, agrégalas a mano.</p>` : ''}
    <table><thead><tr><th>Prerrequisito</th><th>Ramo</th><th>Confianza</th></tr></thead><tbody>
      ${rel.filter(r => r.confianza === 'revisar').map(fila).join('')}
      ${rel.filter(r => r.confianza !== 'revisar').map(fila).join('')}
    </tbody></table>
    <div class="add"><button type="button" id="btnBajar" style="flex:1">Descargar prerrequisitos</button>
      <button type="button" class="cerrar" id="btnReset">Volver al borrador</button></div>
    <p class="ayuda">Tus correcciones se guardan solo en este navegador. Para que las vean
       todos, descarga el archivo y pega su contenido en el bloque
       <code>const PREREQ = [ … ]</code> que está dentro de <code>malla.html</code>,
       cerca del comienzo del script. El archivo descargado ya viene con el formato correcto
       y con el nombre de cada ramo comentado al lado.</p>`;
  document.getElementById('btnBajar').onclick = () => {
    const orden = relaciones()
      .sort((x, y) => (RAMO[x.a].semestre - RAMO[y.a].semestre)
        || RAMO[x.a].nombre.localeCompare(RAMO[y.a].nombre));
    // la coma va ANTES del comentario, si no queda dentro de el
    const cuerpo = orden.map((r, i) => '  ' + JSON.stringify(r)
      + (i < orden.length - 1 ? ',' : '')
      + '   // ' + RAMO[r.de].nombre + ' -> ' + RAMO[r.a].nombre).join('\n');
    const txt = '[\n' + cuerpo + '\n]';
    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'prerrequisitos.txt';
    a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById('btnReset').onclick = () => {
    state.edits = null; store.set('malla:edits', ''); pintar(); pintarDialogo();
  };
}

function pintar() {
  const rev = relaciones().filter(r => r.confianza === 'revisar').length;
  document.getElementById('nota').innerHTML =
    `<b>Los prerrequisitos son un borrador</b>La malla oficial no los trae escritos; se
     reconstruyeron de las flechas del Excel. ${rev} están marcadas como dudosas.
     <button type="button" id="notaVer">Ver de dónde salen y corregirlos</button>`;
  document.getElementById('notaVer').onclick = abrirDialogo;
  pintarMalla();
  pintarPanel();
  guardar();
}

function abrirDialogo() { pintarDialogo(); document.getElementById('dlg').showModal(); }
document.getElementById('btnDatos').onclick = abrirDialogo;
document.getElementById('dlgX').onclick = () => document.getElementById('dlg').close();
document.getElementById('btnPrint').onclick = () => window.print();
document.getElementById('btnClear').onclick = () => {
  if (!state.aprobados.size || confirm('¿Desmarcar todos los ramos aprobados?')) {
    state.aprobados.clear(); state.sel = null; pintar();
  }
};

pintar();
</script>
</body>
</html>
